name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  # write нужен только для публикации отчётов сборки комментарием к коммиту
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  core:
    name: Ядро, рендер и превью (без GPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          key: core

      - name: Форматирование
        run: cargo fmt --all -- --check
        continue-on-error: true

      # Отчёты публикуются комментарием к коммиту: так ошибки видно прямо
      # на странице коммита, даже если логи запуска недоступны.
      - name: Компиляция
        continue-on-error: true
        run: |
          status=0
          cargo check -p worldgod_core -p worldgod_render -p worldgod_preview \
            --all-targets --message-format short > check.log 2>&1 || status=$?
          {
            echo "**cargo check · ядро, рендер, превью** (код $status)"
            echo '```'
            grep -vE '^ *(Downloaded|Downloading|Compiling|Updating|Locking|Adding|Checking)' check.log \
              | head -c 60000
            echo '```'
          } > report.md
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F "body=@report.md" > /dev/null || true
          # Аннотации check-run отдаются обычным REST API — дублируем туда
          # строки про ошибки, чтобы они были видны без доступа к логам.
          python3 - "$status" <<'PY'
          import re, sys

          status = sys.argv[1]
          try:
              raw = open("check.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raw = ""
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", raw)
          lines = [l for l in text.splitlines() if l.strip()]
          key = [
              l
              for l in lines
              if re.search(r"error\[|^error|panicked|FAILED|failures:|assertion|left:|right:", l)
          ]
          body = "\n".join((key or lines)[-60:])
          escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=core-check(" + status + ")::" + escaped[:19000])
          PY

      - name: Clippy (ядро и рендер)
        run: cargo clippy -p worldgod_core -p worldgod_render -p worldgod_preview --all-targets

      - name: Тесты (симуляция, рендер, превью)
        continue-on-error: true
        run: |
          status=0
          cargo test -p worldgod_core -p worldgod_render -p worldgod_preview \
            > test.log 2>&1 || status=$?
          {
            echo "**cargo test · ядро, рендер, превью** (код $status)"
            echo '```'
            tail -c 60000 test.log
            echo '```'
          } > report.md
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F "body=@report.md" > /dev/null || true
          # Аннотации check-run отдаются обычным REST API — дублируем туда
          # строки про ошибки, чтобы они были видны без доступа к логам.
          python3 - "$status" <<'PY'
          import re, sys

          status = sys.argv[1]
          try:
              raw = open("test.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raw = ""
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", raw)
          lines = [l for l in text.splitlines() if l.strip()]
          key = [
              l
              for l in lines
              if re.search(r"error\[|^error|panicked|FAILED|failures:|assertion|left:|right:", l)
          ]
          body = "\n".join((key or lines)[-60:])
          escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=core-test(" + status + ")::" + escaped[:19000])
          PY
          exit $status

      - name: Документация и примеры из doc-комментариев
        run: cargo test --doc -p worldgod_core -p worldgod_render

      - name: Скриншоты сцен
        run: cargo run --release -p worldgod_preview -- --out docs --px 4

      - name: Загрузить скриншоты
        uses: actions/upload-artifact@v4
        with:
          name: worldgod-previews
          if-no-files-found: error
          retention-days: 14
          path: docs/preview-*.png

  app:
    name: Приложение (eframe + egui)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Системные библиотеки для окна
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: app

      - name: Компиляция
        continue-on-error: true
        run: |
          status=0
          cargo check -p worldgod_app --all-targets --message-format short > check.log 2>&1 \
            || status=$?
          {
            echo "**cargo check · приложение** (код $status)"
            echo '```'
            grep -vE '^ *(Downloaded|Downloading|Compiling|Updating|Locking|Adding|Checking)' check.log \
              | head -c 60000
            echo '```'
          } > report.md
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F "body=@report.md" > /dev/null || true
          # Аннотации check-run отдаются обычным REST API — дублируем туда
          # строки про ошибки, чтобы они были видны без доступа к логам.
          python3 - "$status" <<'PY'
          import re, sys

          status = sys.argv[1]
          try:
              raw = open("check.log", encoding="utf-8", errors="replace").read()
          except FileNotFoundError:
              raw = ""
          text = re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", raw)
          lines = [l for l in text.splitlines() if l.strip()]
          key = [
              l
              for l in lines
              if re.search(r"error\[|^error|panicked|FAILED|failures:|assertion|left:|right:", l)
          ]
          body = "\n".join((key or lines)[-60:])
          escaped = body.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=app-check(" + status + ")::" + escaped[:19000])
          PY

      - name: Clippy
        run: cargo clippy -p worldgod_app --all-targets

      - name: Тесты интерфейса
        continue-on-error: true
        run: |
          status=0
          cargo test -p worldgod_app > test.log 2>&1 || status=$?
          {
            echo "**cargo test · приложение** (код $status)"
            echo '```'
            tail -c 60000 test.log
            echo '```'
          } > report.md
          GH_TOKEN="${{ secrets.GITHUB_TOKEN }}" gh api -X POST \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -F "body=@report.md" > /dev/null || true
          exit $status

      - name: Сборка десктопного бинарника
        run: cargo build --release -p worldgod_app --bin worldgod

      - name: Артефакт для Linux
        uses: actions/upload-artifact@v4
        with:
          name: worldgod-linux
          if-no-files-found: error
          retention-days: 14
          path: target/release/worldgod
