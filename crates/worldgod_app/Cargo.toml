[package]
name = "worldgod_app"
description = "WorldGod — симулятор бога на Rust + egui, собирается в APK для Android."
# cargo-apk берёт это значение как versionName в APK.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "worldgod_app"
# cdylib нужен Android-у, lib — десктопу и тестам.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "worldgod"
path = "src/main.rs"

[dependencies]
worldgod_core.workspace = true
worldgod_render.workspace = true

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "android-native-activity",
] }
winit = { version = "0.30", default-features = false, features = [
    "android-native-activity",
] }
android_logger = "0.14"
log = "0.4"

# --- Метаданные APK для cargo-apk -------------------------------------------

[package.metadata.android]
package = "com.worldgod.game"
apk_name = "worldgod"
build_targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
]
resources = "res"

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 35

[package.metadata.android.application]
label = "WorldGod"
icon = "@mipmap/ic_launcher"
theme = "@android:style/Theme.Material.NoActionBar.Fullscreen"

[package.metadata.android.application.activity]
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|uiMode|density"
